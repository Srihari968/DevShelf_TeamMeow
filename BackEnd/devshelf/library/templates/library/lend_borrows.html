<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lend Books</title>
    <link rel="stylesheet" href="{% static 'Lend_Borrows.css' %}">
</head>

<body>

    <div class="Menu">
        ≡
      </div>
    <div class="container">
        <!-- <span id="msg"> Hello {{username}}</span> -->
       
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Akshara</h2>
            </div>
            <ul>
                <li>
                    <form action="/library/home/" method="post">
                        {% csrf_token %}
                        <input type = "text" name = "username" value = "{{username}}" hidden>
                        <button type="submit" class="fas fa-user" >HomePage</button>
                    </form>
                </li>
                <li>
                    <form action="/library/view_lent_books/">
                        <button  type="submit" class="fas fa-search">Receive Books</button>
                    </form>
                </li>
                <li>

                    <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <div class="box">
            <div class="boxcontent">

                <section>



                    <h1 id="title">AKSHARA</h1>
                    <div class="tbl-header">
                        <table cellpadding="0" cellspacing="0" border="0">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Title</th>
                                    <th>Request time</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                    <div class="tbl-content">
                        <table cellpadding="0" cellspacing="0" border="0">
                            <tbody>
                                {% for x in borrowals %}
                                <tr>
                                    <td>{{x.user.username}}</td>
                                    <td>{{x.book.title}}</td>
                                    <td class="BorrowTime">{{x.borrow_time}}</td>
                                    <td class="LendBtn">
                                        <form action="/library/lend_book/" method="post">
                                            {% csrf_token %}
                                            <input id="username1" type="text" name="username" value="{{username}}"
                                                hidden>
                                            <button name="lend_id" value="{{x.id}}">
                                                <b>LEND</b>
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                {% endfor %}

                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script src="{% static 'Lend_Borrows.js' %}"></script>
</body>

</html>
