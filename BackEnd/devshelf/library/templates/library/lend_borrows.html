<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lend Books</title>
    <link rel="stylesheet"  href="{% static 'Lend_Borrows.css' %}">
</head>

<body>
    <div class="container">
       <span id="msg"> Hello {{username}}</span>


        <div class="box">
            <div class="boxcontent">
              
                <section>
                    
                
        
                    <h1 id="title">AKSHARA</h1>
                    <div class="tbl-header">
                      <table cellpadding="0" cellspacing="0" border="0">
                        <thead>
                          <tr>
                            <th>User</th>
                            <th>Title</th>
                            <th>Request time</th>
                          </tr>
                        </thead>
                      </table>
                    </div>

                    <div class="tbl-content">
                      <table cellpadding="0" cellspacing="0" border="0">
                        <tbody>
                            {% for x in borrowals %}
                            <tr>
                                <td>{{x.user.username}}</td>
                                <td>{{x.book.title}}</td>
                                <td class="BorrowTime" >{{x.borrow_time}}</td>
                                <td class="LendBtn">
                                    <form action = "/library/lend_book/" method="post">
                                        {% csrf_token %}
                                        <input id = "username1" type = "text" name = "username" value = "{{username}}" hidden>
                                        <button name = "lend_id" value = "{{x.id}}">
                                            <b>LEND</b>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                
                        {% endfor %}
                          
                        </tbody>
                      </table>
                    </div>
                </section>

            </div>
        </div>
    </div>
