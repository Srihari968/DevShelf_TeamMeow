<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <style>
    table, th, td {
  border: 1px solid black;
}
</style>

<table>
    <tr>
        <th>Username</th>
        <th>Title</th>
        <th>Receive</th>
    </tr>
    {% for x in lents %}
    <tr>
        <td>{{x.user.username}}</td>
        <td>{{x.book.title}}</td>
        <td>
            <form action = "/library/receive_book/" method="post">
                {% csrf_token %}
                <button name = "borrowal_id" value = "{{x.id}}">
                            <b>RECEIVE</b>
                </button>
                <input id = "username1" type = "text" name = "username" value = "{{username}}" hidden>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>


</body>
</html>
