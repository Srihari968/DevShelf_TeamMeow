<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Receive Books</title>
    <link rel="stylesheet" href="{% static 'Receive_Books.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
</head>

<body>

    <div class="Menu">
        <span class="fas fa-bars"></span>
       </div>
    
    <div class="container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Akshara</h2>
            </div>
            <ul>
                <li>
                    <form action="/library/home/" method="post">
                        {% csrf_token %}
                        <input type = "text" name = "username" value = "{{username}}" hidden>
                        <button type="submit" class="fas fa-user Btn" >  HomePage</button>
                    </form>
                </li>
                <li>
                    <form action="/library/view_lent_books/">
                        <button  type="submit" class="fas fa-search Btn">  Lend Books</button>
                    </form>  
                </li>
                <li>

                    <button type="submit" class="Btn fas"  >  Logout</button>
                </li>
            </ul>
        </nav>
        
        <div class="box">
            <div class="boxcontent">

                <section>
                    <h1 id="title">AKSHARA</h1>
                    <div class="tbl-header">
                        <table>
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Title</th>
                                    <th>Borrow time</th>
                                    <th>Due time</th>
                                    <th>Receive</th>

                                </tr>
                            </thead>
                        </table>

                    </div>
                    <div class="tbl-content">
                        <table cellpadding="0" cellspacing="0" border="0">
                            <tbody>
                                {% for x in lents %}
                                <tr>
                                    <td>{{x.user.username}}</td>
                                    <td>{{x.book.title}}</td>
                                    <td class="BorrowTime">{{x.borrow_time}}</td>
                                    <td class="ReturnTime">{{x.return_time}}</td>
                                    <td class="ReceiveBtn">
                                        <form action="/library/receive_book/" method="post">
                                            {% csrf_token %}
                                            <button name="borrowal_id" value="{{x.id}}">
                                                <b>RECEIVE</b>
                                            </button>
                                            <input id="username1" type="text" name="username" value="{{username}}"
                                                hidden>
                                        </form>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script src="{% static 'Receive_Books.js' %}"></script>

</body>



</html>
