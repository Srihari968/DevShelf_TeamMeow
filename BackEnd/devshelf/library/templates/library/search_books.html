<h1>Hello {{username}}</h1>
<table>
    <tr>
        <th> Title</th>
        <th> Authur</th>
        <th> Genre</th>
        <th> Count</th>
        <th> Borrow</th>
    </tr>
{% for book in books %}
    <tr>
        <td>{{book.title}}</td>
        <td>{{book.author}}</td>
        <td>{{book.genre}}</td>
        <td>{{book.count}}</td>
        <td>
            <form action="/library/borrow/" method="post">
                {% csrf_token %}
                <input type="text" id = "username" value = "{{username}}" name = "username" hidden>
                <input type="submit" id="{{book.title}}" value="{{book.title}}" name = "borrow" content="borrow"/>

            </form>
        </td>
    </tr>

{% endfor %}
</table>
