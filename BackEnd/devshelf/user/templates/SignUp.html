<!DOCTYPE html>

{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'SignUpPageStyle.css' %}" >
</head>

<body>

<div class="container">
    
        <div class="page">       
            <div class="title">
                <h3>Akshara</h3>
            </div>
            <div class="pagecontent">
               
                <form class="SU" action = "/user/signup/" method="post">
                    {% csrf_token %}
                    <div class="SUField">
            
                        <p class="Display">Enter your Username:</p>
                        <input type="text" class="SUInfo" placeholder="Username" name = "username">
                    </div>
                    <div class="SUField">
            
                        <p class="Display">Enter your Name:</p>
                        <input type="text" class="SUInfo" placeholder="Name" name = "name">
                    </div>
                    <div class="SUField">
            
                        <p class="Display">Enter your Email:</p>
                        <input type="text" class="SUInfo" placeholder="Email" name = "email">
                    </div>
                    <div class="SUField2">
            
                        <p class="Display">Enter your Phone Number:</p>
                        <input type="text" class="SUInfo" placeholder="Phone Number" name = "phone_number">
                    </div>
                    <div class="SUField2">
            
                        <p class="Display">Enter your Password:</p>
                        <input type="password" class="SUInfo" placeholder="Password" name = "password">
                    </div>
                    <div class="SUField2">
            
                        <p class="Display">Confirm the Password</p>
                        <input type="password" class="SUInfo" placeholder="Confirm Password" name = "confirm_password">
                    </div>
                   
                    <div class="SUField3">
            
                        <span class="Display">Admin:</span>
                        <input type="checkbox" class="SUInfo" placeholder="Admin">
                    </div>
                   

                    <button class="button SUSubmit">
                        <span class="ButtonText">SignUp</span>
                        <i class="ButtonIcon_Symbol"></i>
                    </button>
                </form>

                <div class="LogIn">
                   <p class="condition">Already have an Account?</p>
                    <button class="LogInBtn">
                       <a >Login</a>
                    </button>
                </div>
            </div>
            <div class="message">
                    {%for message in messages%}
                    <h3 class="msg1">{{message}}</h3>
                    {%endfor%}
                </div>
           
            <div class="pagebackground">
                <span class="pagebackgroundShape pagebackground_shape4"></span>
                <span class="pagebackgroundShape pagebackground_shape3"></span>
                <span class="pagebackgroundShape pagebackground_shape2"></span>
                <span class="pagebackgroundShape pagebackground_shape1"></span>
            </div>
        </div>
</div>

</body>

</html>
