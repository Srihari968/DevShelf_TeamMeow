<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="LoginPageStyle.css">
</head>

<body>

<div class="container">
    
        <div class="page">       
            <div class="title">
                <h3>Akshara</h3>
            </div>
            <div class="pagecontent">
               
                <form class="login">
                    <div class="LoginField">
                        <i class="LoginIcon_User"></i>
                        <input type="text" class="LoginInfo" placeholder="Username">
                    </div>
                    <div class="LoginField">
                        <i class="LoginIcon_Lock"></i>
                        <input type="Password" class="LoginInfo" placeholder="Password">
                    </div>
                    <button class="button LoginSubmit">
                        <span class="ButtonText">LogIn</span>
                        <i class="ButtonIcon_Symbol"></i>
                    </button>
                </form>

                <div class="SignUp">

                    <button class="SignUpBtn">
                       <a >Sign Up</a>
                    </button>
                </div>
            </div>
           
            <div class="pagebackground">
                <span class="pagebackgroundShape pagebackground_shape4"></span>
                <span class="pagebackgroundShape pagebackground_shape3"></span>
                <span class="pagebackgroundShape pagebackground_shape2"></span>
                <span class="pagebackgroundShape pagebackground_shape1"></span>
            </div>
        </div>
</div>

</body>

</html>
